<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Sorteio de participantes e praças do restaurante">
<link rel="manifest" href="manifest.json">
<title>Sorteio Restaurante</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
main{max-width:650px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d1d5db;border-radius:16px;padding:18px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:25px}h2{font-size:18px;margin:0 0 12px}
.muted{color:#6b7280;font-size:14px}.count{float:right;color:#6b7280;font-size:14px}
textarea{width:100%;min-height:125px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;resize:vertical}
button{min-height:48px;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #9ca3af;color:#111827}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plaza{padding:12px 5px;text-align:center;border:1px solid #d1d5db;border-radius:10px;font-weight:700}
.result{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid #d1d5db;border-radius:11px;margin-top:8px}
.person{font-weight:700;overflow-wrap:anywhere}.plaza-result{font-weight:800;white-space:nowrap}
.actions{display:flex;gap:8px}.actions button{flex:1}
.status{margin-top:10px}.empty{padding:15px 0;color:#6b7280;text-align:center}
@media(max-width:380px){main{padding:12px}.actions{flex-direction:column}.grid{gap:6px}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>🎲 Sorteio Restaurante</h1>
<p class="muted">Sorteie pessoas e distribua automaticamente as Praças 1 a 6.</p>
</section>

<section class="card">
<h2>Participantes <span id="count" class="count">0 pessoas</span></h2>
<p class="muted">Digite um participante por linha.</p>
<textarea id="names" placeholder="João&#10;Maria&#10;Pedro&#10;Ana&#10;Carlos&#10;Paulo"></textarea>
<div style="height:10px"></div>
<button id="load" class="secondary" style="width:100%">Carregar participantes</button>
<p id="status" class="muted status">Adicione os nomes para começar.</p>
</section>

<section class="card">
<h2>Praças</h2>
<div class="grid">
<div class="plaza">Praça 1</div><div class="plaza">Praça 2</div><div class="plaza">Praça 3</div>
<div class="plaza">Praça 4</div><div class="plaza">Praça 5</div><div class="plaza">Praça 6</div>
</div>
</section>

<section class="card">
<h2>Resultado</h2>
<div id="results" class="empty">O resultado aparecerá aqui.</div>
</section>

<button id="draw" class="primary" disabled>🎲 SORTEAR TODOS</button>

<div style="height:10px"></div>
<div class="actions">
<button id="copy" class="secondary" disabled>Copiar resultado</button>
<button id="reset" class="secondary">Nova rodada</button>
</div>
</main>

<script>
(() => {
let participants=[], lastResult=[], busy=false;
const $=id=>document.getElementById(id);
function rnd(n){
 if(n<=1)return 0;
 if(window.crypto&&crypto.getRandomValues){
  const max=4294967296,limit=max-(max%n),a=new Uint32Array(1);
  do{crypto.getRandomValues(a)}while(a[0]>=limit);
  return a[0]%n;
 }
 return Math.floor(Math.random()*n);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function update(){ $("count").textContent=participants.length+" pessoa"+(participants.length===1?"":"s"); $("draw").disabled=busy||!participants.length; $("copy").disabled=!lastResult.length; }
function render(){
 const box=$("results"); box.innerHTML="";
 if(!lastResult.length){box.className="empty";box.textContent="O resultado aparecerá aqui.";return}
 box.className="";
 lastResult.forEach(x=>{const r=document.createElement("div");r.className="result";const p=document.createElement("span");p.className="person";p.textContent=x.name;const q=document.createElement("span");q.className="plaza-result";q.textContent="Praça "+x.plaza;r.append(p,q);box.append(r)})
}
$("load").onclick=()=>{
 if(busy)return;
 const raw=$("names").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 participants=raw.filter((n,i)=>raw.findIndex(x=>x.toLocaleLowerCase("pt-BR")===n.toLocaleLowerCase("pt-BR"))===i);
 lastResult=[];render();update();
 $("status").textContent=participants.length? (participants.length<=6?"Participantes carregados. Todos receberão uma praça.":"Participantes carregados. Serão sorteadas 6 pessoas e 6 praças."):"Digite pelo menos um nome.";
};
$("draw").onclick=()=>{
 if(busy||!participants.length)return;
 busy=true;update();$("status").textContent="Sorteando pessoas e praças…";$("results").innerHTML='<div class="empty">🎲 Embaralhando…</div>';
 setTimeout(()=>{
  const people=shuffle(participants).slice(0,6), plazas=shuffle([1,2,3,4,5,6]);
  lastResult=people.map((name,i)=>({name,plaza:plazas[i]}));
  render();busy=false;update();$("status").textContent="Sorteio concluído. Cada pessoa recebeu uma praça diferente.";
 },650);
};
$("copy").onclick=()=>{
 const text=lastResult.map(x=>x.name+" — Praça "+x.plaza).join("\n");
 if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>$("status").textContent="Resultado copiado.");
 else $("status").textContent="Copie os resultados manualmente.";
};
$("reset").onclick=()=>{
 if(busy)return;
 participants=[];lastResult=[];$("names").value="";$("status").textContent="Adicione os nomes para começar.";render();update();
};
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
update();
})();
</script>
</body>
</html>
